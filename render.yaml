services:
  - type: web
    name: cohortiq-backend
    env: python
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: CORS_ORIGINS
        value: "*"

  - type: web
    name: cohortiq-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /((?!assets/|.*\\.(?:css|js|json|png|jpg|jpeg|gif|svg|ico|ttf|woff|woff2)).*)
        destination: /index.html
